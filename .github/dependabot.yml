version: 2
updates:
  # github-actions only: keeps the SHA-pinned actions in the zipx-generated workflows current.
  # Scala/sbt library updates come from Scala Steward instead
  # (.github/workflows/zipx-scala-steward.yml), which reads the build directly and groups its PRs.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
