name: zipx sbt setup
description: JDK, sbt, optional Node, and LocalDir sbt cache (checkout is a prior workflow step). Generated by zipx; do not edit by hand.
inputs:
  java-version:
    description: Temurin JDK version
    required: "true"
  runner-os:
    description: Runner OS label used in the cache key prefix
    required: "true"
  cache-key-suffix:
    description: Per-job suffix so same-run jobs do not race on one cache key
    required: "true"
  node-version:
    description: Optional Node version; empty skips setup-node
    required: "false"
    default: ""
  sbt-disk-cache:
    description: Passed to sbt/setup-sbt disk-cache
    required: "false"
    default: "false"
  local-cache:
    description: When true, resolve epoch and restore/save the LocalDir sbt cache
    required: "false"
    default: "true"
  cache-epoch:
    description: Fixed cache epoch; when non-empty skips git-tag resolve and keys the cache with this value
    required: "false"
    default: ""
runs:
  using: composite
  steps:
    - name: Setup JDK
      uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
      with:
        distribution: temurin
        java-version: ${{ inputs.java-version }}
    - uses: sbt/setup-sbt@8feba82adc7f01ddcf8165b86f778bdb5b82cebc # v1.5.7
      with:
        disk-cache: ${{ inputs.sbt-disk-cache }}
    - name: Setup Node
      if: inputs.node-version != ''
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ inputs.node-version }}
    - name: Resolve cache epoch
      id: cache-epoch
      if: inputs.local-cache == 'true' && inputs.cache-epoch == ''
      run: |
        set -euo pipefail
        tag_match='v*'
        if git remote get-url origin >/dev/null 2>&1; then
          remote_count=$(git ls-remote --tags --refs origin "$tag_match" 2>/dev/null | wc -l | tr -d ' ')
          local_count=$(git tag -l "$tag_match" | wc -l | tr -d ' ')
          if [ "$remote_count" -gt 0 ] && [ "$local_count" -lt "$remote_count" ]; then
            echo "::warning title=zipx cache epoch::Local tags ($local_count) fewer than origin ($remote_count). Epoch may be stale; checkout must use fetch-depth: 0 and fetch-tags: true."
          fi
        fi
        if [[ "${GITHUB_REF:-}" == refs/tags/v* ]]; then
          release="${GITHUB_REF#refs/tags/v}"
          epoch="$release"
        elif tag=$(git describe --tags --abbrev=0 --match "$tag_match" 2>/dev/null); then
          release="${tag#v}"
          epoch="${release}-ci"
        else
          echo "::warning title=zipx cache epoch::No tags matching '$tag_match' found; using epoch 0.0.0."
          release="0.0.0"
          epoch="0.0.0"
        fi
        echo "epoch=$epoch" >> "$GITHUB_OUTPUT"
        echo "release=$release" >> "$GITHUB_OUTPUT"

      shell: bash
    - name: Cache sbt
      if: inputs.local-cache == 'true' && inputs.cache-epoch == ''
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.sbt
          ~/.cache/sbt
          ~/.cache/coursier
          target
        key: ${{ inputs.runner-os }}-jdk${{ inputs.java-version }}-sbt-${{ steps.cache-epoch.outputs.epoch }}-${{ github.run_id }}-${{ inputs.cache-key-suffix }}
        restore-keys: |
          ${{ inputs.runner-os }}-jdk${{ inputs.java-version }}-sbt-${{ steps.cache-epoch.outputs.epoch }}-${{ github.run_id }}-
          ${{ inputs.runner-os }}-jdk${{ inputs.java-version }}-sbt-${{ steps.cache-epoch.outputs.epoch }}-
          ${{ inputs.runner-os }}-jdk${{ inputs.java-version }}-sbt-${{ steps.cache-epoch.outputs.release }}-
          ${{ inputs.runner-os }}-jdk${{ inputs.java-version }}-sbt-
    - name: Cache sbt
      if: inputs.local-cache == 'true' && inputs.cache-epoch != ''
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.sbt
          ~/.cache/sbt
          ~/.cache/coursier
          target
        key: ${{ inputs.runner-os }}-jdk${{ inputs.java-version }}-sbt-${{ inputs.cache-epoch }}-${{ github.run_id }}-${{ inputs.cache-key-suffix }}
        restore-keys: |
          ${{ inputs.runner-os }}-jdk${{ inputs.java-version }}-sbt-${{ inputs.cache-epoch }}-${{ github.run_id }}-
          ${{ inputs.runner-os }}-jdk${{ inputs.java-version }}-sbt-${{ inputs.cache-epoch }}-
          ${{ inputs.runner-os }}-jdk${{ inputs.java-version }}-sbt-
