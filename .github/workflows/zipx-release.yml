# Generated by zipx. Do not edit. Run 'sbt zipxWorkflowGenerate' to regenerate.
name: zipx release
"on":
  push:
    tags:
      - v*
  workflow_dispatch:
    inputs:
      ships:
        description: all, or comma-separated ship names (client, libs)
        type: string
        required: true
        default: all
permissions:
  contents: write
concurrency:
  group: zipx-release
  cancel-in-progress: false
jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.ref_name == github.event.repository.default_branch
    environment: zipx-release
    env:
      COURSIER_TTL: "0s"
      PGP_KEY_HEX: ${{ secrets.PGP_KEY_HEX }}
      PGP_PASSPHRASE: ${{ secrets.PGP_PASSPHRASE }}
      SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
      SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: "0"
          fetch-tags: "true"
      - name: zipx sbt setup
        uses: ./.github/actions/zipx-sbt-setup
        with:
          java-version: "25"
          runner-os: ubuntu-latest
          cache-key-suffix: release
          node-version: ""
          sbt-disk-cache: "false"
          cache-mode: restore
          cache-epoch: "3583f1734eaa9359"
      - name: Tag is on the default branch
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/$ZIPX_DEFAULT_BRANCH"; then
            echo "::error title=zipx release::zipx: tag $GITHUB_REF_NAME is not on $ZIPX_DEFAULT_BRANCH"
            exit 1
          fi
        env:
          ZIPX_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      - name: Import signing key
        run: |
          mkdir -p ~/.gnupg && chmod 700 ~/.gnupg
          echo "allow-loopback-pinentry" >> ~/.gnupg/gpg-agent.conf
          echo "pinentry-mode loopback"   >> ~/.gnupg/gpg.conf
          gpgconf --kill gpg-agent || true
          echo "$PGP_SECRET" | base64 --decode | gpg --batch --import
        env:
          PGP_SECRET: ${{ secrets.PGP_SECRET }}
      - name: Release request
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "ZIPX_RELEASE_REF=$ZIPX_SHIPS" >> "$GITHUB_ENV"
          else
            echo "ZIPX_RELEASE_REF=$GITHUB_REF" >> "$GITHUB_ENV"
          fi
        env:
          ZIPX_SHIPS: ${{ inputs.ships }}
      - name: Release
        run: |
          set -euo pipefail
          sbt "zipxRelease $ZIPX_RELEASE_REF"
      - name: Tag and publish GitHub Releases
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          for tag in $(cat "target/zipx-release-tags.txt"); do
            gh release create "$tag" --target "$GITHUB_SHA" --generate-notes
          done
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Open the next snapshot
        run: |
          set -euo pipefail
          echo "## Open the next snapshot" >> "$GITHUB_STEP_SUMMARY"
          echo "These rows are released. Further snapshots of them publish nothing until the catalog moves." >> "$GITHUB_STEP_SUMMARY"
          cat target/zipx-release-tags.txt >> "$GITHUB_STEP_SUMMARY"
          echo "On this commit: sbt zipxModverBump" >> "$GITHUB_STEP_SUMMARY"
